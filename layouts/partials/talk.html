<li>
  <span style="font-size: 90%; opacity: 80%">{{ time.Format .site.Language.Params.dateFormat .talk.date }}.</span>
  {{ .talk.speaker }}:
  {{ if .talk.url }}
    <a href="{{ .talk.url }}"><em>{{ .talk.title }}</em></a>
  {{ else }}
    <em>{{ .talk.title }}</em>
  {{ end }}
  {{ if .talk.type }}<span style="font-size: 75%; opacity: 80%">({{ i18n .talk.type }})</span>{{ end }}
</li>
